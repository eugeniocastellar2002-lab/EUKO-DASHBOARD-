<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>EUKO Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="grain"></div></div>
<button class="iconbtn" id="themebtn" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>

<main class="scene" id="scene">
  <div class="wrap">
    <div class="tilt" id="tilt">
      <section class="login-panel glass" id="panel" aria-labelledby="ttl">
        <div class="logo-f rev" style="--d:0" role="img" aria-label="EUKO Sport Trade"><i class="ld"></i><i class="ll"></i></div>
        <h1 id="ttl" class="rev" style="--d:1">Bienvenido de nuevo</h1>
        <p class="lead rev" style="--d:2">Ingresa para ver el panel de tus clientes y tus resultados.</p>

        <form id="login-form" novalidate>
          <div class="field rev" style="--d:3" id="f-user">
            <input id="user" name="username" type="text" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false">
            <label for="user">Usuario o correo</label>
            <span class="field-icon" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg></span>
          </div>
          <div class="field rev" style="--d:4" id="f-pass">
            <input id="pass" name="password" type="password" placeholder=" " autocomplete="current-password">
            <label for="pass">Contraseña</label>
            <button class="field-icon icon-button" id="eye" type="button" aria-label="Mostrar contraseña" aria-pressed="false"></button>
          </div>
          <p class="hint" id="caps" hidden><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 4 4 13h5v4h6v-4h5L12 4Z"/><path d="M9 20h6"/></svg>Tienes activado Bloq Mayús</p>
          <div class="row rev" style="--d:5">
            <label class="chk"><input type="checkbox" id="remember"><span class="box"><svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Recordar mi usuario</label>
            <button type="button" class="link" id="forgot">¿Olvidaste tu contraseña?</button>
          </div>
          <button class="login-button rev" style="--d:6" id="btn" type="submit"><span class="lbl">Ingresar</span><span class="spin" aria-hidden="true"></span></button>
          <p class="message" id="msg" role="alert" aria-live="polite"></p>
        </form>

        <div class="done" id="done" hidden>
          <svg class="big" viewBox="0 0 100 100" aria-hidden="true"><circle class="c" pathLength="1" cx="50" cy="50" r="44" transform="rotate(-90 50 50)"/><path class="t" pathLength="1" d="m30 52 14 14 27-30"/></svg>
          <h2>Acceso concedido</h2>
          <p id="doneTxt">Entrando al panel…</p>
          <button type="button" class="btn2" id="again" hidden>Volver al inicio de sesión</button>
        </div>

      </section>
    </div>
  </div>
  <p class="foot rev" style="--d:8">EUKO Sport Trade · Acceso privado</p>
</main>

<script>
(function(){
'use strict';
/* ================= CONFIGURACIÓN =================
   API_URL: dirección de tu backend para iniciar sesión, por ejemplo "https://tu-api.com/api/login".
   Debe aceptar POST con JSON {username, password, remember}. Respuestas esperadas:
     200  -> acceso correcto (el servidor guarda la sesión en una cookie HttpOnly; puede devolver {name})
     401  -> usuario o contraseña incorrectos      429 -> demasiados intentos
   Con API_URL vacío se usa el acceso local de más abajo (ACCESS_HASH).
   DASHBOARD_URL: página a la que se va después de entrar (vacío = solo muestra el éxito). */
var CONFIG={API_URL:'',DASHBOARD_URL:'admin.html',MAX_TRIES:5,LOCK_SECONDS:30};
/* Acceso local (mientras no haya backend): solo entra el usuario y la contraseña que se guardaron aquí.
   Se guarda una huella (SHA-256) en lugar de la contraseña escrita, para que no se lea directamente en el código.
   Para cambiar el usuario o la clave hay que generar una huella nueva. */
var ACCESS_HASH='b18d5b4b2fe7860f3682164e5aa2877cd1359942f2ac8788b02c2c9214994172';

var $=function(s){return document.querySelector(s)};
var IC={
 eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeOff:'<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6A10.5 10.5 0 0 1 12 5.5C18.4 5.5 22 12 22 12a17 17 0 0 1-3.2 3.9"/><path d="M6.6 7.2A16.6 16.6 0 0 0 2 12s3.6 6.5 10 6.5c1.5 0 2.8-.3 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
 sun:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
 moon:'<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>'
};
var form=$('#login-form'),user=$('#user'),pass=$('#pass'),btn=$('#btn'),msg=$('#msg'),panel=$('#panel'),eye=$('#eye'),caps=$('#caps'),remember=$('#remember');
var busy=false,fails=0,lockT=null;

/* tema (misma preferencia que el panel) */
function isDark(){var t=document.documentElement.getAttribute('data-theme');return t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches}
function paintTheme(){$('#themebtn').innerHTML=isDark()?IC.sun:IC.moon}
try{var st=localStorage.getItem('euko-theme');if(st==='dark'||st==='light')document.documentElement.setAttribute('data-theme',st)}catch(e){}
$('#themebtn').addEventListener('click',function(){var n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('euko-theme',n)}catch(e){}paintTheme()});
paintTheme();

/* ojo para ver la contraseña */
function paintEye(){var s=pass.type==='text';eye.innerHTML=s?IC.eyeOff:IC.eye;eye.setAttribute('aria-pressed',s);eye.setAttribute('aria-label',s?'Ocultar contraseña':'Mostrar contraseña')}
eye.addEventListener('click',function(){pass.type=pass.type==='password'?'text':'password';paintEye();pass.focus()});
paintEye();

/* aviso de Bloq Mayús */
function capsCheck(e){if(e.getModifierState)caps.hidden=!e.getModifierState('CapsLock')}
pass.addEventListener('keydown',capsCheck);pass.addEventListener('keyup',capsCheck);pass.addEventListener('blur',function(){caps.hidden=true});

/* usuario recordado (nunca la contraseña) */
try{var su=localStorage.getItem('euko-user');if(su){user.value=su;remember.checked=true}}catch(e){}

/* mensajes y efectos */
function say(t,k){msg.textContent=t||'';msg.className='message'+(k?' '+k:'')}
/* avisos que llegan desde el panel (sesión cerrada o vencida) */
try{var qs=new URLSearchParams(location.search).get('s');
  if(qs==='expirada')say('Tu sesión se cerró por inactividad. Ingresa de nuevo.','success');
  else if(qs==='salio')say('Cerraste sesión correctamente.','success');
  if(qs)history.replaceState(null,'',location.pathname)}catch(e){}
function shake(){panel.classList.remove('shake');void panel.offsetWidth;panel.classList.add('shake');panel.classList.add('err');setTimeout(function(){panel.classList.remove('shake')},500);setTimeout(function(){panel.classList.remove('err')},1600)}
function mark(el,on){el.closest('.field').classList.toggle('bad',on);el.setAttribute('aria-invalid',on?'true':'false')}
[user,pass].forEach(function(el){el.addEventListener('input',function(){mark(el,false);if(msg.classList.contains('error')&&!lockT)say('')})});
function setBusy(b){busy=b;btn.classList.toggle('loading',b);btn.disabled=b||!!lockT}
$('#forgot').addEventListener('click',function(){say('Para restablecer tu acceso, comunícate con el administrador de EUKO.','success')});

/* bloqueo temporal tras varios intentos fallidos (solo mejora la experiencia; el límite real lo pone el servidor) */
function lock(){
  var left=CONFIG.LOCK_SECONDS;btn.disabled=true;
  var tick=function(){if(left<=0){clearInterval(lockT);lockT=null;fails=0;btn.disabled=false;say('Ya puedes intentarlo de nuevo.','success');return}say('Demasiados intentos. Espera '+left+' s para volver a probar.','error');left--};
  tick();lockT=setInterval(tick,1000);
}

/* ================= AUTENTICACIÓN =================
   Esta es la única función que habla con tu backend. */
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
/* SHA-256 en JavaScript puro: funciona aunque el navegador no ofrezca crypto.subtle (por ejemplo, al abrir el archivo directamente o por una IP local). */
function sha256js(str){
  var K=[],H=[],i,j,w=[],bytes=Array.from(new TextEncoder().encode(str)),l=bytes.length*8;
  var isP=function(n){for(var f=2;f*f<=n;f++)if(n%f===0)return false;return true};
  var fr=function(x){return((x-Math.floor(x))*4294967296)|0};
  for(var c=2,n=0;n<64;c++)if(isP(c)){if(n<8)H[n]=fr(Math.pow(c,.5));K[n++]=fr(Math.pow(c,1/3))}
  bytes.push(128);while(bytes.length%64!==56)bytes.push(0);
  for(i=7;i>=0;i--)bytes.push(i>3?0:(l>>>(i*8))&255);
  var rr=function(x,k){return(x>>>k)|(x<<(32-k))};
  for(i=0;i<bytes.length;i+=64){
    for(j=0;j<16;j++)w[j]=(bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3];
    for(j=16;j<64;j++){var s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3),s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)|0}
    var a=H[0],b=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(j=0;j<64;j++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[j]+w[j])|0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&cc)^(b&cc),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){return(x>>>0).toString(16).padStart(8,'0')}).join('');
}
async function sha256(t){
  if(window.crypto&&crypto.subtle){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){}}
  return sha256js(t);
}
async function authenticate(username,password,rem){
  if(!CONFIG.API_URL){
    await wait(700);
    var h=await sha256(username.trim()+'\n'+password.trim()+'\nEUKO');
    if(h===ACCESS_HASH)return {ok:true,name:username.trim()};
    return {ok:false,msg:'Usuario o contraseña incorrectos.'};
  }
  var r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:username,password:password,remember:rem})});
  if(r.status===401||r.status===403)return {ok:false,msg:'Usuario o contraseña incorrectos.'};
  if(r.status===429)return {ok:false,msg:'Demasiados intentos. Espera un momento e inténtalo de nuevo.',block:true};
  if(!r.ok)throw new Error('HTTP '+r.status);
  var d={};try{d=await r.json()}catch(e){}
  return {ok:true,name:d.name||username};
}

function success(res){
  try{var n=Date.now();sessionStorage.setItem('euko-auth',JSON.stringify({name:res.name,t:n,a:n}))}catch(e){}
  try{if(remember.checked)localStorage.setItem('euko-user',user.value.trim());else localStorage.removeItem('euko-user')}catch(e){}
  say('');panel.classList.add('ok');
  form.hidden=true;$('.lead').hidden=true;$('#ttl').hidden=true;
  var d=$('#done');d.hidden=false;
  if(CONFIG.DASHBOARD_URL){$('#doneTxt').textContent='Entrando al panel…';setTimeout(function(){location.replace(CONFIG.DASHBOARD_URL)},1500)}
  else{$('#doneTxt').textContent='Así se verá al entrar. Aquí te llevaría a tu panel.';$('#again').hidden=false}
}
$('#again').addEventListener('click',function(){
  panel.classList.remove('ok');$('#done').hidden=true;form.hidden=false;$('.lead').hidden=false;$('#ttl').hidden=false;
  pass.value='';pass.type='password';paintEye();say('');pass.focus();
});

form.addEventListener('submit',async function(e){
  e.preventDefault();if(busy||lockT)return;
  var u=user.value.trim(),p=pass.value;say('');mark(user,false);mark(pass,false);
  if(!u||!p){mark(user,!u);mark(pass,!p);say(!u&&!p?'Escribe tu usuario y tu contraseña.':!u?'Escribe tu usuario o correo.':'Escribe tu contraseña.','error');shake();(u?pass:user).focus();return}
  setBusy(true);
  try{
    var res=await authenticate(u,p,remember.checked);
    if(res.ok){fails=0;success(res)}
    else{
      fails++;mark(pass,true);say(res.msg,'error');shake();pass.select();
      if(res.block||fails>=CONFIG.MAX_TRIES){setBusy(false);lock();return}
    }
  }catch(err){say('No pudimos conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.','error');shake()}
  setBusy(false);
});

/* inclinación suave y brillo que siguen el cursor */
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,fine=matchMedia('(hover: hover) and (pointer: fine)').matches;
if(!reduce&&fine){
  var tilt=$('#tilt'),raf=0;
  document.addEventListener('pointermove',function(e){
    if(raf)return;raf=requestAnimationFrame(function(){raf=0;
      var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
      tilt.style.setProperty('--ry',(x*7).toFixed(2)+'deg');tilt.style.setProperty('--rx',(-y*6).toFixed(2)+'deg');
      var r=panel.getBoundingClientRect();panel.style.setProperty('--mx',(e.clientX-r.left)+'px');panel.style.setProperty('--my',(e.clientY-r.top)+'px');
    });
  });
  document.addEventListener('pointerleave',function(){tilt.style.setProperty('--rx','0deg');tilt.style.setProperty('--ry','0deg')});
}
})();
</script>
</body>
</html>
